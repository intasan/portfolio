<!doctype html><html lang="en"><meta charset="utf-8"><title>Portfolio browser QA</title><style>body{font:14px system-ui;margin:20px}button{padding:12px;margin:5px}iframe{display:block;border:1px solid #aaa;height:880px;max-width:none}pre{white-space:pre-wrap}#frame-wrap{overflow:auto;max-width:100%}</style><h1>Portfolio browser QA</h1><button id="run">Run 27 pages at 4 widths</button><button data-width="360">Mobile 360</button><button data-width="390">Mobile 390</button><button data-width="768">Tablet 768</button><button data-width="1440">Desktop 1440</button><a href="index.html">Open home</a><p id="status">Ready</p><pre id="result"></pre><div id="frame-wrap"><iframe id="frame" title="Responsive preview" src="index.html" width="390"></iframe></div><script>
const frame=document.querySelector('iframe'),status=document.querySelector('#status'),result=document.querySelector('#result');
const pages=['index.html','cv-verified.html','analysis/index.html','ppe-case-study.html','ku-exite.html',...['adoption','agricultural','booking','clothesline','flood','gesture','gold-thai','gold-trading','motoinsight','open-house','ppe','social','space','system-design','tarot','vending','yuyenpensuk'].map(x=>'case-studies/'+x+'.html'),...['booking','flood','gold-thai','vending','yuyenpensuk'].map(x=>'analysis/'+x+'/index.html')];
const settle=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.width=b.dataset.width;frame.src='index.html';status.textContent='Home at '+b.dataset.width+' CSS pixels';});
document.querySelector('#run').onclick=async()=>{const rows=[];for(const p of pages){status.textContent='Checking '+p;await new Promise(resolve=>{frame.onload=resolve;frame.src=p;});const d=frame.contentDocument;await d.fonts.ready;for(const width of [360,390,768,1440]){frame.width=width;await settle();rows.push({page:p,width,viewport:frame.contentWindow.innerWidth,documentWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>width,brokenLoadedImages:[...d.images].filter(i=>i.getAttribute('src')&&i.complete&&!i.naturalWidth).map(i=>i.getAttribute('src')),h1:d.querySelectorAll('h1').length});}result.textContent=JSON.stringify(rows,null,2);}status.textContent='Complete: '+rows.length+' rendered page/width combinations';frame.width=390;frame.src='index.html';};
</script></html>
